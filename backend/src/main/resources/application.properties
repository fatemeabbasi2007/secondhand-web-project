# Server port ? Render injects $PORT
server.port=${PORT:8080}

# Database ? Render will give you these env vars
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/secondhand_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Cloudinary (from env vars ? never commit real secrets)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Static resources ? classpath only (we'll copy frontend into the jar)
spring.web.resources.static-locations=classpath:/static/